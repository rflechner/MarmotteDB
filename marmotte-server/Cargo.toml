[package]
name = "marmotte-server"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
actix-web = "4.15.0"
bytes = "1.12.1"
crc32fast = "1.5.1"
figlet-rs = "1.0.0"
filesize = "0.2.0"
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
log = "0.4.34"
utoipa = { version = "5.5.0", features = ["actix_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["actix-web", "vendored"] }
